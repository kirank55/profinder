incumbents:
  - name: AWS RDS Proxy
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html
    quote: "Amazon RDS Proxy does not perform automatic, transparent read/write splitting of your database traffic... application code must be configured to send the appropriate requests to the correct connection pool or proxy endpoint."
    seat_match: adjacent_pain
    leftover: Managed connection pooler providing separate static reader and writer endpoints; performs zero SQL statement inspection, zero automatic read/write splitting, and zero WAL replication lag tracking.
  - name: PgCat
    url: https://github.com/postgresml/pgcat
    quote: "PgCat is a PostgreSQL connection pooler that supports automatic read/write splitting, which can introduce challenges regarding read-your-writes consistency due to asynchronous replication lag."
    seat_match: adjacent_pain
    leftover: High-performance Rust connection pooler that can route SELECT to replicas, but lacks per-client causal session LSN tracking; queries executed immediately after a write hit stale replicas unless manually pinned to primary.
  - name: Pgpool-II
    url: https://www.pgpool.net/docs/latest/en/html/runtime-config-load-balancing.html
    quote: "If a standby node's delay exceeds this threshold, Pgpool-II will stop sending SELECT queries to that node... delay_threshold specifies the maximum tolerated replication lag in WAL bytes."
    seat_match: adjacent_pain
    leftover: Employs coarse, cluster-wide periodic polling (sr_check_period) to check lag thresholds in bytes; lacks per-request/session causal tokens, forcing all clients to either risk stale reads or manually annotate SQL with /*NO LOAD BALANCE*/ comments.
  - name: Heimdall Data
    url: https://www.heimdalldata.com/
    quote: "Heimdall tracks writes on a per-table basis... to determine the freshness of replicas and automatically route queries."
    seat_match: adjacent_pain
    leftover: Proprietary enterprise middleware tracking table-level write timestamps rather than per-session WAL LSN offsets; table-level lockouts force all queries on recently active tables back to the primary, defeating replica scaling during continuous writes.
  - name: Prisma Accelerate
    url: https://www.prisma.io/accelerate
    quote: "Prisma Accelerate is primarily a managed connection pooling and caching service designed for serverless and edge environments... does not natively expose or manage LSN-based read replication."
    seat_match: wrong_substrate
    leftover: Edge query cache and connection pooler tied to Prisma ORM client; does not manage PostgreSQL replication lag or multi-node LSN routing for arbitrary PostgreSQL drivers.
  - name: ProxySQL
    url: https://proxysql.com/
    quote: "ProxySQL is a high performance, high availability, protocol aware proxy for MySQL."
    seat_match: wrong_substrate
    leftover: MySQL wire protocol only; completely incompatible with PostgreSQL v3 wire protocol and PostgreSQL WAL replay LSN semantics.

